<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Mural de Achados e Perdidos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Mural de Achados e Perdidos</h1>

    <form id="form-item">

        <label for="titulo">Título da postagem</label>
        <input type="text" name="titulo" placeholder="Título" required>

        <label for="descricao">Descrição do item achado</label>
        <textarea name="descricao" placeholder="Descrição"> </textarea>

        <label for="local">Local em que o item foi achado</label>
        <input type="text" name="local" placeholder="Local" required>

        <label for="tipo">Informe se o objeto foi achado ou perdido</label>

        <select name="tipo" required>

            <option value="achado">Achado</option>
            <option value="perdido">Perdido</option>

        </select>

        <label for="categoria">Informe o tipo do objeto</label>

        <select name="categoria">

            <option value="documento">Documento</option>
            <option value="chaves">Chaves</option>
            <option value="celular">Celular</option>
            <option value="carteira">Carteira</option>
            <option value="pet">Pet</option>
            <option value="outros">Outros</option>

        </select>

        <label for="foto">Adicione uma imagem do objeto</label>
        <input type="file" name="foto" accept="image/*">

        <label for="contato">Adicionar contato</label>
        <input type="text" name="contato" placeholder="WhatsApp" required>

        <label for="data_perdido_achado">Data em que foi achado ou perdido</label>
        <input type="date" name="data_perdido_achado">

        <small>Guarde essa senha: ela é a única forma de editar ou apagar sua postagem.</small>
        <input type="password" name="senha" placeholder="Senha para editar/apagar depois" required minlength="4">

        <button type="submit" id="btn-enviar">Cadastrar</button>
        <button type="button" id="btn-cancelar" hidden>Cancelar</button>

    </form>

    <p id="mensagem"></p>

    <div id="filtros">

        <select id="filtro-tipo">

            <option value="">Todos os tipos</option>
            <option value="achado">Achados</option>
            <option value="perdido">Perdidos</option>

        </select>

        <select id="filtro-categoria">

            <option value="">Todas as categorias</option>
            <option value="documento">Documento</option>
            <option value="chaves">Chaves</option>
            <option value="celular">Celular</option>
            <option value="carteira">Carteira</option>
            <option value="pet">Pet</option>
            <option value="outros">Outros</option>

        </select>

    </div>

    <div id="mural"></div>

    <script src="js/app.js"></script>
</body>

</html>
